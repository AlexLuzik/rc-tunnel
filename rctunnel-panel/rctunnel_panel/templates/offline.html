{% extends "base.html" %}
{% block title %}{{ title }} · RC-Tunnel{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(1200px 600px at 50% -10%,var(--rc-green-100),transparent 60%),var(--bs-body-bg);">
  <div class="rc-enter" style="max-width:440px;">
    <div style="font-size:78px;line-height:1;margin-bottom:14px;animation:rc-float 4s ease-in-out infinite;">{{ icon }}</div>
    <h1 style="font-size:1.75rem;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;">{{ title }}</h1>
    <p style="color:var(--bs-secondary-color);font-size:1rem;margin:0 0 18px;">{{ message }}</p>
    {% if host %}<div style="display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:.84rem;background:var(--rc-card-bg);border:1px solid var(--bs-border-color);border-radius:10px;padding:8px 14px;color:var(--rc-green-700);"><i class="ti ti-world"></i>{{ host }}</div>{% endif %}
    {% if retry %}<p style="color:var(--bs-secondary-color);font-size:.8rem;margin:16px 0 0;"><i class="ti ti-refresh"></i> Checking again automatically…</p>{% endif %}
  </div>
</div>
{% if retry %}<script>setTimeout(function(){ location.reload(); }, 5000);</script>{% endif %}
{% endblock %}
